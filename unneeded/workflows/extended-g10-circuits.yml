name: Extended seven-token attention and causal circuit comparison

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extended-g10-circuits.yml'

permissions:
  contents: read
  actions: read

jobs:
  seven-token-circuit:
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, frozen_g0, real_anchor_half, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout original paper submodule and Omniglot
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Authors-compatible JAX dependencies
        run: python -m pip install -r requirements.txt
      - name: Original task config from 1M Base G0
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Validation-selected Extended G0
        uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0/
      - name: Original Extended G3 with identical G0 initialization
        uses: actions/download-artifact@v4
        with:
          name: extended-original-3gen-fixedinit-${{ matrix.arm }}
          run-id: 38631919983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g3/
      - name: Verified Extended G6 and G10
        uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-${{ matrix.arm }}
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g10/
      - name: Original HDF5 identity check
        run: python scripts/check_data.py
      - name: Measure actual seven-token attention and perturb selected output heads
        run: |
          python scripts/compare_extended_circuits_g10.py --g0-root outputs/extended_g0 --g3-root outputs/extended_g3 --g10-root outputs/extended_g10 --arm ${{ matrix.arm }} --n 128 --seed 4817 --out outputs/extended_circuits/${{ matrix.arm }}.json
      - name: Verify generation, role and causal ablation completeness
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('outputs/extended_circuits/${{ matrix.arm }}.json').read_text())
          assert d['test_evaluated'] is False
          assert d['actual_extended_logits_equal_manual_seven_token_aux'] is True
          assert d['generations']==[0,3,6,10]
          assert len(d['results'])==4
          assert 0<=d['selected_l2_first_head']<8
          assert 0<=d['selected_l2_second_head']<8
          for rec in d['results'].values():
              assert set(rec)=={'val_relabel','val_exemplar','val_classes'}
              for v in rec.values():
                  assert v['num_validation_episodes']==128
                  for kind in ('natural','ablated_first_candidate','ablated_second_candidate'):
                      assert 0<=v[kind]['first_label_accuracy']<=1
                      assert 0<=v[kind]['second_label_teacher_forced_accuracy']<=1
                  for margin in ('l2_query_first_number_matching_margin_by_head',
                    'l2_query_second_number_matching_margin_by_head'):
                      assert len(v['attention'][margin])==8
          print('EXTENDED_SEVENTOKEN_ABLATION_CHECK_PASSED')
          PY
      - name: Preserve original-model Extended mechanistic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-seven-token-circuit-${{ matrix.arm }}
          path: outputs/extended_circuits/
          if-no-files-found: warn
