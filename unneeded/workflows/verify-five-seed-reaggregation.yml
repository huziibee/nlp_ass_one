name: Reaggregate all original five-seed G10 checkpoints
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-reaggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Original Base primary G10 source
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-g10-*
          run-id: 38632979396
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/base_primary
          merge-multiple: false
      - name: Original Base additional seeds 2 and 3
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-independent-g10-*
          run-id: 38642335173
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/base_replica
          merge-multiple: false
      - name: Original Base additional seeds 4 and 5
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-five-seed-g10-*
          run-id: 38788294704
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/base_additional
          merge-multiple: false
      - name: Original Extended primary G10 source
        uses: actions/download-artifact@v4
        with:
          pattern: extended-original-g10-*
          run-id: 38633208767
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/extended_primary
          merge-multiple: false
      - name: Original Extended additional seeds 2 and 3
        uses: actions/download-artifact@v4
        with:
          pattern: extended-independent-g10-*
          run-id: 38641472801
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/extended_replica
          merge-multiple: false
      - name: Original Extended additional seeds 4 and 5
        uses: actions/download-artifact@v4
        with:
          pattern: extended-five-seed-g10-*
          run-id: 38788302762
          github-token: ${{ github.token }}
          path: outputs/five_seed_inputs/extended_additional
          merge-multiple: false
      - name: Independently reaggregate ALL 20 checkpoint-backed G10 conditions
        run: |
          python scripts/aggregate_five_seeds_g10.py \
            --root outputs/five_seed_inputs \
            --out outputs/reaggregated_five_seed
      - name: Compare reconstruction with original committed five-seed paper figures
        run: |
          python - <<'PY'
          import json,math,hashlib
          from pathlib import Path
          expected=json.loads(Path('docs/experiments/g10_five_seed/g10_seed_summary.json').read_text())
          actual=json.loads(Path('outputs/reaggregated_five_seed/g10_seed_summary.json').read_text())
          assert expected['n_model_seeds_per_task']==actual['n_model_seeds_per_task']==5
          assert expected['independent_test_set_for_G10'] is actual['independent_test_set_for_G10'] is False
          assert expected['training_exposures_per_generation']==actual['training_exposures_per_generation']
          metric_count=0
          for task,metrics in expected['paired_effects'].items():
              assert set(metrics)==set(actual['paired_effects'][task])
              for name,original in metrics.items():
                  rebuilt=actual['paired_effects'][task][name]
                  assert original['per_seed_clean_minus_recursive'].keys()==rebuilt['per_seed_clean_minus_recursive'].keys()
                  for seed,value in original['per_seed_clean_minus_recursive'].items():
                      assert math.isclose(value,rebuilt['per_seed_clean_minus_recursive'][seed],abs_tol=1e-6)
                  assert math.isclose(original['mean_clean_minus_recursive'],rebuilt['mean_clean_minus_recursive'],abs_tol=1e-6)
                  metric_count+=1
          print(f'ALL_FIVE_SEED_CHECKPOINTS_REAGGREGATED={metric_count} endpoints verified, 20 arms, no new training')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-five-seed-checkpoint-reaggregation
          path: outputs/reaggregated_five_seed/
          if-no-files-found: warn
