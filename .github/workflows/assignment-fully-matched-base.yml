name: Fully matched Base and Extended 300k G0 plus G1-G10 example budgets
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-fully-matched-base.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  base-g0-300k:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - run: |
          python scripts/check_data.py
          python scripts/base_fully_matched_300k.py --task g0 --g0-root outputs/base_g0_300k --out outputs/base_g0_300k
      - uses: actions/upload-artifact@v4
        with:
          name: base-fully300k-g0
          path: outputs/base_g0_300k/
          if-no-files-found: error
  base-g10-300k:
    needs: base-g0-300k
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-fully300k-g0
          path: outputs/base_g0_300k/
      - run: |
          python scripts/base_fully_matched_300k.py --task descendants --g0-root outputs/base_g0_300k --out outputs/base_g10_300k --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-fully300k-g10-${{ matrix.arm }}
          path: outputs/base_g10_300k/
          if-no-files-found: warn
  archive:
    needs: base-g10-300k
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: base-fully300k-g10-*
          path: inputs/
          merge-multiple: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Validate exact 300k G0 and descendant budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('docs/experiments/base_full_budget_300k')
          out.mkdir(parents=True,exist_ok=True)
          d={'g0_exposures':300000,'descendant_exposures':300000,
             'task':'Original Singh Base numeric label prediction',
             'replicates':1,'protected_final_test':False,'arms':{}}
          for arm in ('clean_only','recursive_replacement'):
              root=Path('inputs')/('base-fully300k-g10-'+arm)
              rows=[]
              for gen in range(1,11):
                  m=json.loads((root/arm/f'g{gen:02d}'/'metrics.json').read_text())
                  assert m['optimizer_exposures']==300000
                  assert m['final_test_evaluated'] is False
                  rows.append({'generation':gen,'val_relabel':m['history'][-1]['validation']['val_relabel']['accuracy'],
                    'val_classes':m['history'][-1]['validation']['val_classes']['accuracy']})
              d['arms'][arm]=rows
          (out/'summary.json').write_text(json.dumps(d,indent=2))
          print('FULL_BUDGET_MATCH_SUCCESS='+json.dumps({k:v[-1] for k,v in d['arms'].items()}))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/base_full_budget_300k
          git diff --cached --quiet || git commit -m 'Archive truly budget-matched 300k Base G0 through G10 result'
          git pull --rebase origin assignment-mechanism-followups-20261015
          git push origin HEAD:assignment-mechanism-followups-20261015
