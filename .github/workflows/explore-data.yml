name: Verify and explore published Omniglot features

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/explore-data.yml'
      - 'scripts/check_data.py'
      - 'scripts/inspect_data.py'
      - 'scripts/feature_matching_baseline.py'
      - 'scripts/make_data_report.py'

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository and original-data submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-only dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Verify original feature file identity and structure
        run: python scripts/check_data.py
      - name: Explore original feature geometry
        run: python scripts/inspect_data.py --out docs/data-audit --seed 42 --plot-classes 30
      - name: Compute non-neural nearest-neighbour controls
        run: python scripts/feature_matching_baseline.py --out docs/data-audit --seed 42 --episodes 50000
      - name: Build browsable report
        run: python scripts/make_data_report.py --out docs/data-audit
      - name: Upload full exploratory dataset audit
        uses: actions/upload-artifact@v4
        with:
          name: omniglot-verified-data-audit
          path: docs/data-audit/
      - name: Commit plots and derived summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data-audit/
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified exploratory measurements from Omniglot features'
            git push
          fi
