name: Distinguish attention circuit degradation, redistribution and label shortcuts
on:
  push:
    branches: [abc-circuit-causal-discrimination-20261015]
    paths: ['.github/workflows/assignment-abc-mechanism.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  abc-mechanism:
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-${{ matrix.arm }}
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g10/
      - name: Original feature integrity and legal contextual counterfactual tests
        run: |
          python scripts/check_data.py
          python scripts/abc_counterfactual_head_audit.py --arm ${{ matrix.arm }} --base-root outputs/base_g0/ --g0-root outputs/extended_g0/ --g10-root outputs/extended_g10/ --out outputs/abc/${{ matrix.arm }}.json --n 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-counterfactual-${{ matrix.arm }}
          path: outputs/abc/
          if-no-files-found: warn
  archive:
    needs: abc-mechanism
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: abc-counterfactual-*
          path: docs/experiments/abc_mechanism/
          merge-multiple: false
      - name: Require real full hypothesis-discrimination metrics for both arms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('docs/experiments/abc_mechanism')
          files=list(base.rglob('*.json'))
          assert len(files)==2,files
          for f in files:
            x=json.loads(f.read_text())
            assert x['protected_final_test_evaluated'] is False
            assert x['validation_episodes_per_role']==128
            for role in ('val_relabel','val_exemplar','val_classes'):
              assert set(x['roles'][role])=={'g0','g10'}
              for g in ('g0','g10'):
                assert len(x['roles'][role][g]['ablations'])>=15
                assert set(x['roles'][role][g]['counterfactual_tests'])=={
                  'swap_support_labels','swap_support_order','flip_query_to_other_support'}
          print('ABC_MECHANISM_RESULTS_ACTUALLY_COMPLETED')
          PY
      - name: Save scientific hypothesis audit in durable Git history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/abc_mechanism
          git diff --cached --quiet || git commit -m 'Archive actual A B C counterfactual retrieval and head-compensation experiments'
          git pull --rebase origin abc-circuit-causal-discrimination-20261015
          git push origin HEAD:abc-circuit-causal-discrimination-20261015
