name: Smoke test original-Singh Base recursive training

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-recursion-smoke.yml'
      - 'scripts/base_recursive.py'

permissions:
  contents: read
  actions: read

jobs:
  smoke-original-base-recursion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout exact source and Omniglot data
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install authors-compatible pinned JAX
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Download completed 1M-sequence G0 Base checkpoint
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Verify original dataset and frozen partitions
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/split.json
      - name: Exercise all four arms through two generations
        run: |
          python scripts/base_recursive.py --generations 2 --steps 8 --batch-size 8 --eval-every 8 --eval-count 64 --seed 34001 --out outputs/base_recursive_smoke
      - name: Check saved training metrics and generator provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/base_recursive_smoke/summary.json')
          d = json.loads(p.read_text())
          assert not d['final_test_evaluated']
          assert not d['training_prefix_generated']
          assert set(d['arms']) == {'clean_only','recursive_replacement','real_anchor_half','frozen_g0'}
          assert all(len(v) == 2 for v in d['arms'].values())
          for arm in d['arms']:
              for g in (1, 2):
                  m = json.loads((p.parent/arm/f'g{g:02d}'/'metrics.json').read_text())
                  assert m['generation'] == g and m['optimizer_exposures'] == 64
                  assert not m['final_test_evaluated']
                  assert (p.parent/arm/f'g{g:02d}'/'model.eqx').is_file()
                  assert 'val_classes' in m['history'][-1]['validation']
          assert all(json.loads((p.parent/'recursive_replacement'/f'g{g:02d}'/'metrics.json').read_text())['real_target_count'] == 0 for g in (1,2))
          print('BASE_RECURSION_SMOKE_PASSED')
          PY
      - name: Upload checkpoint/metrics from experimental integration smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-base-recursion-integration-smoke
          path: outputs/base_recursive_smoke/
          if-no-files-found: warn
