name: Original Omniglot Base G10 continuation (G4-G10)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-g10-continuation.yml'

permissions:
  contents: read
  actions: read

jobs:
  continue-base-to-g10:
    strategy:
      fail-fast: false
      matrix:
        arm:
          - clean_only
          - recursive_replacement
          - real_anchor_half
          - frozen_g0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Source code and original Omniglot features
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install original author-compatible JAX
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Original reference Base G0 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Original complete G1-G3 arm checkpoint/metrics
        uses: actions/download-artifact@v4
        with:
          name: original-base-3gen-${{ matrix.arm }}
          run-id: 38627953800
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_original_g3/
      - name: Verify unchanged canonical split
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/original_split.json
      - name: Check original G3 checkpoint identity and repeat logged validation
        run: |
          python scripts/resume_base_g10.py --preflight-only --arm ${{ matrix.arm }} --resume-root outputs/base_original_g3 --out outputs/base_g10 --eval-count 512
      - name: Continue original task G4-G10, same one-million sequences per generation
        run: |
          python scripts/resume_base_g10.py --arm ${{ matrix.arm }} --start 4 --end 10 --steps 31250 --batch-size 32 --eval-every 3125 --eval-count 512 --seed 34001 --temperature 1.0 --resume-root outputs/base_original_g3 --out outputs/base_g10
      - name: Verify ten generations, lineage, fixed split and test sealing
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          arm="${{ matrix.arm }}"
          root=Path('outputs/base_g10')
          report=json.loads((root/'summary.json').read_text())
          assert report['final_test_evaluated'] is False
          assert report['training_prefix_generated'] is False
          assert report['no_retraining_of_g1_to_g3'] is True
          assert [x['generation'] for x in report['arms'][arm]]==list(range(1,11))
          assert report['original_split']==[50,1473,100]
          for g in range(4,11):
              folder=root/arm/f'g{g:02d}'
              m=json.loads((folder/'metrics.json').read_text())
              assert (folder/'model.eqx').stat().st_size>1000
              assert m['optimizer_exposures']==1_000_000
              assert m['final_test_evaluated'] is False
              assert m['generator_generation']==(None if arm=='clean_only' else 0 if arm=='frozen_g0' else g-1)
              assert m['class_split']==[50,1473,100]
              assert math.isfinite(m['history'][-1]['validation']['val_relabel']['loss'])
          print('BASE_FULL_G10_COMPLETE='+json.dumps({
              'arm':arm,'validation_g10':report['arms'][arm][-1]['last_validation'],
              'final_test_evaluated':False
          }))
          PY
      - name: Archive G4-G10 full checkpoints and G0-G10 trajectory manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-base-g10-${{ matrix.arm }}
          path: outputs/base_g10/
          if-no-files-found: warn
