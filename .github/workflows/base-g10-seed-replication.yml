name: Independent-seed original Singh Base G0-G10 robustness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-g10-seed-replication.yml'

permissions:
  contents: read
  actions: read

jobs:
  replicate-original-base-g0:
    strategy:
      fail-fast: false
      matrix:
        seed: [505, 605]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Authors source submodule and original Omniglot
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compatible original JAX environment
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Original feature file and frozen task protocol check
        run: python scripts/check_data.py
      - name: Train one million original Base episodes with independent initialization
        run: |
          python scripts/base_replica_g0.py --init-seed ${{ matrix.seed }} --out outputs/base_replicate_g0
      - name: Preserve independently trained Base G0 and validation-only history
        uses: actions/upload-artifact@v4
        with:
          name: original-base-independent-g0-${{ matrix.seed }}
          path: outputs/base_replicate_g0/
          if-no-files-found: error

  replicate-base-recursion:
    needs: replicate-original-base-g0
    strategy:
      fail-fast: false
      matrix:
        include:
          - base_seed: 505
            recursive_seed: 35001
          - base_seed: 605
            recursive_seed: 36001
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Original Base source code and train/validation data
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install original author dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Independent original-author G0 from this exact workflow
        uses: actions/download-artifact@v4
        with:
          name: original-base-independent-g0-${{ matrix.base_seed }}
          path: outputs/base_replicate_g0/
      - name: Train G1-G10 clean versus fully recursive on matched original episodes
        run: |
          python scripts/base_recursive.py --artifact-root outputs/base_replicate_g0 --generations 10 --steps 31250 --batch-size 32 --eval-every 31250 --eval-count 512 --seed ${{ matrix.recursive_seed }} --temperature 1.0 --arms ${{ matrix.arm }} --out outputs/base_replicate_g10
      - name: Check complete original Base model exposure and final-test protection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm='${{ matrix.arm }}'
          p=Path('outputs/base_replicate_g10')
          summary=json.loads((p/'summary.json').read_text())
          assert summary['final_test_evaluated'] is False
          assert summary['training_prefix_generated'] is False
          assert len(summary['arms'][arm])==10
          for g in range(1,11):
              folder=p/arm/f'g{g:02d}'
              m=json.loads((folder/'metrics.json').read_text())
              assert m['optimizer_exposures']==1_000_000
              assert m['class_split']==[50,1473,100]
              assert m['data_seed']==${{ matrix.recursive_seed }}
              assert m['final_test_evaluated'] is False
              assert (folder/'model.eqx').stat().st_size>1000
          print('INDEPENDENT_BASE_G10='+json.dumps({
              'base_g0_seed':${{ matrix.base_seed }},
              'replication_seed':${{ matrix.recursive_seed }},
              'arm':arm,'validation':summary['arms'][arm][-1]['last_validation']
          }))
          PY
      - name: Preserve all ten trained checkpoints and validation metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-base-independent-g10-${{ matrix.base_seed }}-${{ matrix.arm }}
          path: outputs/base_replicate_g10/
          if-no-files-found: warn
