name: Validate onset G1-G10 and three held-out roles across independent seeds
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-all-seed-onset.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  aggregate-trajectory-and-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Base source G1-G3 clean_only
        uses: actions/download-artifact@v4
        with:
          name: original-base-3gen-clean_only
          run-id: 38627953800
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/primary/early/clean_only/
      - name: Base source G4-G10 clean_only
        uses: actions/download-artifact@v4
        with:
          name: original-base-g10-clean_only
          run-id: 38632979396
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/primary/late/clean_only/
      - name: Extended source G1-G3 clean_only
        uses: actions/download-artifact@v4
        with:
          name: extended-original-3gen-fixedinit-clean_only
          run-id: 38631919983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/primary/early/clean_only/
      - name: Extended source G4-G10 clean_only
        uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-clean_only
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/primary/late/clean_only/
      - name: Base replica 505 clean_only
        uses: actions/download-artifact@v4
        with:
          name: original-base-independent-g10-505-clean_only
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/35001/clean_only/
      - name: Base replica 605 clean_only
        uses: actions/download-artifact@v4
        with:
          name: original-base-independent-g10-605-clean_only
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/36001/clean_only/
      - name: Extended replica 5054 clean_only
        uses: actions/download-artifact@v4
        with:
          name: extended-independent-g10-5054-clean_only
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/5054/clean_only/
      - name: Extended replica 6054 clean_only
        uses: actions/download-artifact@v4
        with:
          name: extended-independent-g10-6054-clean_only
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/6054/clean_only/
      - name: Base source G1-G3 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: original-base-3gen-recursive_replacement
          run-id: 38627953800
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/primary/early/recursive_replacement/
      - name: Base source G4-G10 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: original-base-g10-recursive_replacement
          run-id: 38632979396
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/primary/late/recursive_replacement/
      - name: Extended source G1-G3 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: extended-original-3gen-fixedinit-recursive_replacement
          run-id: 38631919983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/primary/early/recursive_replacement/
      - name: Extended source G4-G10 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-recursive_replacement
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/primary/late/recursive_replacement/
      - name: Base replica 505 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: original-base-independent-g10-505-recursive_replacement
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/35001/recursive_replacement/
      - name: Base replica 605 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: original-base-independent-g10-605-recursive_replacement
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/base/36001/recursive_replacement/
      - name: Extended replica 5054 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: extended-independent-g10-5054-recursive_replacement
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/5054/recursive_replacement/
      - name: Extended replica 6054 recursive_replacement
        uses: actions/download-artifact@v4
        with:
          name: extended-independent-g10-6054-recursive_replacement
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/extended/6054/recursive_replacement/
      - name: Independently verify actual generation metadata and compute seed-level curves
        run: |
          python scripts/aggregate_all_seed_generations.py --root inputs/ --out docs/experiments/all_seed_generations/
      - uses: actions/upload-artifact@v4
        with:
          name: three-seed-validation-onset-and-generalization
          path: docs/experiments/all_seed_generations/
          if-no-files-found: error
      - name: Preserve source-derived seed-level findings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/all_seed_generations
          git diff --cached --quiet || git commit -m 'Archive full three-seed onset and validation-role generalization'
          git pull --rebase origin assignment-mechanism-followups-20261015
          git push origin HEAD:assignment-mechanism-followups-20261015
