name: Await Base seeds then commit three-seed G10 scientific aggregation
on:
  push:
    branches: [assignment-roadmap-g100-20261015]
    paths:
      - '.github/workflows/assignment-three-seed-aggregate.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nlp-three-seed-g10-single-run
  cancel-in-progress: false
jobs:
  verify-and-archive-g10:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Await original independent Base G10 training (do not duplicate seeds)
        run: |
          for attempt in $(seq 1 105); do
            status=$(gh api repos/${{ github.repository }}/actions/runs/38642335173 --jq .status)
            conclusion=$(gh api repos/${{ github.repository }}/actions/runs/38642335173 --jq '.conclusion // "pending"')
            echo "Base run 38642335173 poll $attempt: $status / $conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "Base replication did not pass; stopping"; exit 1; }
              break
            fi
            if [ "$attempt" -eq 105 ]; then echo "Base still pending after bounded wait"; exit 1; fi
            sleep 120
          done
      - name: Get primary original Omniglot Base G10 arms
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-g10-*
          run-id: 38632979396
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/base_primary/
          merge-multiple: false
      - name: Get independent Base G10 seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-independent-g10-*
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/base_replica/
          merge-multiple: false
      - name: Get primary original Extended G10 arms
        uses: actions/download-artifact@v4
        with:
          pattern: extended-original-g10-*
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/extended_primary/
          merge-multiple: false
      - name: Get independent Extended G10 seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: extended-independent-g10-*
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/extended_replica/
          merge-multiple: false
      - name: Verify six independent training seeds, 12 arms and paired effects
        run: |
          python scripts/aggregate_independent_seeds_g10.py --root outputs/seed_artifacts --out docs/experiments/g10_three_seed
      - name: Preserve three-seed scientific tables as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: independently-confirmed-three-seed-g10-tables
          path: docs/experiments/g10_three_seed/
          retention-days: 90
          if-no-files-found: error
      - name: Commit actual per-seed results to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/g10_three_seed
          git diff --cached --quiet || git commit -m 'Archive reproducible Base and Extended G10 paired model-seed effects'
          git pull --rebase origin assignment-roadmap-g100-20261015
          git push origin HEAD:assignment-roadmap-g100-20261015
