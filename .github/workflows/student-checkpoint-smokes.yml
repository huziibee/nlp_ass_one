name: Student checkpoint-backed smoke tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install README requirements
        run: python -m pip install -r requirements.txt
      - name: Restore original verified Base G0
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ github.token }}
          path: outputs/base_full_1m
      - name: Restore original Extended G0
        uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ github.token }}
          path: outputs/extended_g0_full
      - name: Validate downloaded model prerequisites
        run: |
          python scripts/check_data.py
          test -s outputs/base_full_1m/safe_train_val_smoke/config.json
          test -s outputs/base_full_1m/safe_train_val_smoke/checkpoints/00001000000.eqx
          test -s outputs/extended_g0_full/extended_g0_model.eqx
          test -s outputs/extended_g0_full/metrics.json
      - name: Execute README Base smoke entry point on trained checkpoint
        run: python run.py smoke-base
      - name: Execute README Extended smoke entry point on trained checkpoint
        run: python run.py smoke-extended
      - name: Verify measured data and model outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for task in ("smoke_base", "smoke_extended"):
              root=Path("outputs")/task
              summary=json.loads((root/"summary.json").read_text())
              assert summary["final_test_evaluated"] is False
              assert set(summary["arms"]) == {"clean_only", "recursive_replacement"}
              for arm in summary["arms"]:
                  metrics=root/arm/"g01"/"metrics.json"
                  model=root/arm/"g01"/"model.eqx"
                  assert metrics.stat().st_size>100
                  assert model.stat().st_size>1000
                  meta=json.loads(metrics.read_text())
                  assert meta["generation"]==1
                  assert meta["final_test_evaluated"] is False
              print("VERIFIED_STUDENT_SMOKE="+task)
          PY
      - name: Preserve proof of fresh smoke run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-smoke-checkpoints-and-metrics
          path: |
            outputs/smoke_base/
            outputs/smoke_extended/
          if-no-files-found: warn
