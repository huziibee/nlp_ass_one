name: Extended G0 learning-rate pilot (validation only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extended-g0-lr-pilot.yml'

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rate: '0.0001'
            label: lr1e4
          - rate: '0.0003'
            label: lr3e4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Pinned original code and Omniglot
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pinned research requirements
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Reference config and original G0 provenance
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Verify canonical data split
        run: python scripts/reference_split.py --out /tmp/verified_split.json
      - name: Train equal-data validation-only pilot
        run: |
          python scripts/extended_g0.py --steps 9375 --batch-size 32 --eval-every 3125 --eval-count 512 --seed 4054 --learning-rate ${{ matrix.rate }} --temperature 1.0 --out outputs/extended_g0_tuning
      - name: Validate teacher-forcing causal structure
        run: python scripts/verify_extended_causality.py --trained outputs/extended_g0_tuning
      - name: Print summary without touching test classes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/extended_g0_tuning/metrics.json').read_text())
          assert d['final_test_evaluated'] is False
          assert d['steps']*d['batch_size']==300000
          v=d['history'][-1]['validation']
          print('VALIDATION_ONLY_PILOT='+json.dumps({
            'lr':d['learning_rate'],
            'val_relabel':v['val_relabel'],
            'val_exemplar':v['val_exemplar'],
            'val_classes':v['val_classes'],
          }))
          PY
      - name: Keep pilot checkpoints and validation curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-omniglot-${{ matrix.label }}-300k
          path: outputs/extended_g0_tuning/
          if-no-files-found: warn
