name: Graded source-controlled G9 to G10 invalid-symbol repair
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-graded-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  partial-repair:
    strategy:
      fail-fast: false
      matrix:
        pct: [25, 50, 75]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-recursive_replacement
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g10/
      - name: Train one controlled primary seed G10 with graded correction
        run: |
          python scripts/check_data.py
          python scripts/graded_invalid_symbol_repair.py --base-root outputs/base_g0 --g0-root outputs/extended_g0 --g10-root outputs/extended_g10 --fraction 0.${{ matrix.pct }} --out outputs/dose/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graded-repair-${{ matrix.pct }}
          path: outputs/dose/
          if-no-files-found: warn
  archive-dose:
    needs: partial-repair
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/download-artifact@v4
        with:
          name: graded-repair-25
          path: outputs/graded_artifacts/25
      - uses: actions/download-artifact@v4
        with:
          name: graded-repair-50
          path: outputs/graded_artifacts/50
      - uses: actions/download-artifact@v4
        with:
          name: graded-repair-75
          path: outputs/graded_artifacts/75
      - uses: actions/download-artifact@v4
        with:
          name: extended-repair-g10-raw
          run-id: 38641963903
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/graded_artifacts/raw/
      - uses: actions/download-artifact@v4
        with:
          name: extended-repair-g10-fix_invalid_q2
          run-id: 38641963903
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/graded_artifacts/full/
      - run: |
          python scripts/aggregate_graded_repair.py --root outputs/graded_artifacts --out docs/experiments/graded_repair/
      - uses: actions/upload-artifact@v4
        with:
          name: graded-repair-source-verified-results
          path: docs/experiments/graded_repair/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/graded_repair
          git diff --cached --quiet || git commit -m 'Archive real five-level G10 repair dose response'
          git pull --rebase origin assignment-mechanism-followups-20261015
          git push origin HEAD:assignment-mechanism-followups-20261015
