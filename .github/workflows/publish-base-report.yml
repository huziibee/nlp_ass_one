name: Publish verified full Base training curves

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-base-report.yml'

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout data-first repository
        uses: actions/checkout@v4
      - name: Download completed original-author checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data/figure libraries
        run: python -m pip install -r requirements-data.txt
      - name: Derive three figures and measured summary from full training log
        run: |
          python scripts/plot_base_training.py \
            --log outputs/base_full_1m/safe_train_val_smoke/log.h5 \
            --out docs/model-audit
      - name: Build readable evidence audit and limitations
        run: python scripts/make_base_report.py --out docs/model-audit
      - name: Publish derived (non-checkpoint) figures and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/model-audit/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured one-million-sequence Base training report'
            git push
          fi
