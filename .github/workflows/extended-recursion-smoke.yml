name: Extended model recursion smoke (original Omniglot)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extended-recursion-smoke.yml'
      - 'scripts/extended_recursive.py'

permissions:
  contents: read
  actions: read

jobs:
  smoke-extended-recursion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Original authors code and data
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Download reference Base config
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Download tested Extended G0 integration checkpoint
        uses: actions/download-artifact@v4
        with:
          name: extended-original-omniglot-g0-smoke
          run-id: 38628873250
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0_full/
      - name: Exercise all four Extended arms at G1 and G2
        run: |
          python scripts/extended_recursive.py --allow-incomplete-g0-for-smoke --generations 2 --steps 8 --batch-size 8 --eval-every 8 --eval-count 64 --seed 6001 --out outputs/extended_recursive_smoke
      - name: Validate every arm, training provenance and freeze of final test
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('outputs/extended_recursive_smoke')
          report=json.loads((p/'summary.json').read_text())
          assert report['final_test_evaluated'] is False
          assert report['recursively_generated_input_prefix'] is False
          arms=['clean_only','recursive_replacement','real_anchor_half','frozen_g0']
          assert set(report['arms'])==set(arms)
          assert all(len(report['arms'][a])==2 for a in arms)
          for arm in arms:
              for g in (1,2):
                  loc=p/arm/f'g{g:02d}'
                  d=json.loads((loc/'metrics.json').read_text())
                  assert (loc/'model.eqx').stat().st_size>1000
                  assert d['training_exposures']==64
                  assert d['final_test_evaluated'] is False
                  assert d['training_class_split']==[50,1473,100]
                  assert 'val_relabel' in d['history'][-1]['validation']
                  assert d['num_real_targets']+d['num_synthetic_targets']==64
          # Both arms at G1 use precisely the same G0 source, seeds and targets.
          a=(p/'recursive_replacement'/'g01'/'model.eqx').read_bytes()
          b=(p/'frozen_g0'/'g01'/'model.eqx').read_bytes()
          assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest(), 'G1 identity broken'
          print('EXTENDED_RECURSIVE_SMOKE_PASSED')
          PY
      - name: Upload checked recursive Extended integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-omniglot-recursive-integration-smoke
          path: outputs/extended_recursive_smoke/
          if-no-files-found: warn
