name: Publish original Base mechanistic validation plots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-base-mechanistic.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout data-first workspace
        uses: actions/checkout@v4
      - name: Download real validation head-intervention results
        uses: actions/download-artifact@v4
        with:
          name: base-1m-mechanistic-validation
          run-id: 38613565782
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: docs/mechanistic-audit
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render sourced mechanistic interpretation
        run: python scripts/make_base_mechanistic_report.py --out docs/mechanistic-audit
      - name: Commit raw metrics, plots and methodological cautions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mechanistic-audit/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured original Base attention-head interventions'
            git push
          fi
