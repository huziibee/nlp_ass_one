name: Sealed final evaluation of frozen Base and Extended endpoints

# Deliberately manual-only until *all* model-validation gates pass.
# A one-time release commit will activate this exact protocol once.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate-frozen-model:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base_g0
            kind: original_base_g0
            source_id: '0'
            artifact: none
            checkpoint: none
            init_seed: '0'
          - label: base_clean_g3
            kind: base_recursive
            source_id: '38627953800'
            artifact: original-base-3gen-clean_only
            checkpoint: clean_only/g03/model.eqx
            init_seed: '34052'
          - label: base_recursive_g3
            kind: base_recursive
            source_id: '38627953800'
            artifact: original-base-3gen-recursive_replacement
            checkpoint: recursive_replacement/g03/model.eqx
            init_seed: '34052'
          - label: base_halfreal_g3
            kind: base_recursive
            source_id: '38627953800'
            artifact: original-base-3gen-real_anchor_half
            checkpoint: real_anchor_half/g03/model.eqx
            init_seed: '34052'
          - label: base_frozen_g3
            kind: base_recursive
            source_id: '38627953800'
            artifact: original-base-3gen-frozen_g0
            checkpoint: frozen_g0/g03/model.eqx
            init_seed: '34052'
          - label: extended_g0
            kind: extended_g0
            source_id: '38630071147'
            artifact: extended-omniglot-lr3e4-300k
            checkpoint: extended_g0_model.eqx
            init_seed: '4054'
          - label: extended_clean_g3
            kind: extended_recursive
            source_id: '38631919983'
            artifact: extended-original-3gen-fixedinit-clean_only
            checkpoint: clean_only/g03/model.eqx
            init_seed: '4054'
          - label: extended_recursive_g3
            kind: extended_recursive
            source_id: '38631919983'
            artifact: extended-original-3gen-fixedinit-recursive_replacement
            checkpoint: recursive_replacement/g03/model.eqx
            init_seed: '4054'
          - label: extended_halfreal_g3
            kind: extended_recursive
            source_id: '38631919983'
            artifact: extended-original-3gen-fixedinit-real_anchor_half
            checkpoint: real_anchor_half/g03/model.eqx
            init_seed: '4054'
          - label: extended_frozen_g3
            kind: extended_recursive
            source_id: '38631919983'
            artifact: extended-original-3gen-fixedinit-frozen_g0
            checkpoint: frozen_g0/g03/model.eqx
            init_seed: '4054'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout exact frozen source and original Omniglot features
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned authors-compatible dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Source Base G0 and research configuration
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Load declared frozen arm checkpoint
        if: matrix.artifact != 'none'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.source_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen_model/
      - name: Verify canonical split manifest
        run: python scripts/reference_split.py --out /tmp/frozen_reference_split.json
      - name: Open exact once-only sealed test source for this frozen model
        shell: bash
        run: |
          args=(
            --model-kind "${{ matrix.kind }}"
            --config-root "outputs/base_full_1m"
            --out "outputs/sealed_final/${{ matrix.label }}"
            --n 4096 --chunk 128 --seed 20261027
            --init-seed "${{ matrix.init_seed }}"
            --confirm-final-frozen
          )
          if [ "${{ matrix.checkpoint }}" != "none" ]; then
            args+=(--checkpoint "outputs/frozen_model/${{ matrix.checkpoint }}")
          fi
          python scripts/evaluate_sealed.py "${args[@]}"
      - name: Assert exact frozen test scope and saved numeric metrics
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("outputs/sealed_final/${{ matrix.label }}/sealed_final_scores.json")
          x=json.loads(p.read_text())
          assert x["once_only_final_protocol"] is True
          assert x["final_n"]==4096 and x["fixed_evaluation_seed"]==20261027
          assert 1523<=x["sealed_class_ids_min"]<=x["sealed_class_ids_max"]<=1622
          assert x["model_kind"]=="${{ matrix.kind }}"
          for name,m in x["scores"].items():
              if isinstance(m,dict):
                  assert 0<=m["accuracy"]<=1 and math.isfinite(m["cross_entropy"])
                  assert m["n"]==4096
          print("SEALED_FINAL_MODEL_VERIFIED="+json.dumps(x["scores"]))
          PY
      - name: Archive one immutable scored-model record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-final-${{ matrix.label }}
          path: outputs/sealed_final/${{ matrix.label }}/
          if-no-files-found: warn
