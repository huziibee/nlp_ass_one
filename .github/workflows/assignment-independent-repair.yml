name: Replicate original-feature G10 invalid-symbol repair on independent seeds
on:
  push:
    branches: [assignment-roadmap-g100-20261015]
    paths:
      - '.github/workflows/assignment-independent-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nlp-independent-repair-20261015
  cancel-in-progress: false
jobs:
  independent-repair:
    strategy:
      fail-fast: false
      matrix:
        seed: [5054, 6054]
        repair: [raw, fix_invalid_q2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - uses: actions/download-artifact@v4
        with:
          name: extended-independent-g0-${{ matrix.seed }}
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-independent-g10-${{ matrix.seed }}-recursive_replacement
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_seed_g10/
      - name: Check data and seed-specific source artifacts
        run: python scripts/check_data.py
      - name: Reproduce full raw G10 or train matched invalid-q2-plus-label corrected G10
        run: |
          python scripts/extended_g10_repair.py --include-all-replication-seeds --base-root outputs/base_full_1m --g0-root outputs/extended_g0 --g10-root outputs/extended_seed_g10 --repair ${{ matrix.repair }} --seed ${{ matrix.seed }} --init-seed ${{ matrix.seed }} --steps 9375 --learning-rate 0.0003 --temperature 1.0 --out outputs/repair
      - name: Save complete or partial checkpoint and validation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-repair-independent-${{ matrix.seed }}-${{ matrix.repair }}
          path: outputs/repair/
          retention-days: 90
          if-no-files-found: warn
  aggregate-repairs:
    needs: independent-repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: extended-repair-independent-*
          path: outputs/repair_artifacts/
          merge-multiple: false
      - name: Verify provenance and summarize both matched seed pairs
        run: |
          python scripts/summarize_independent_repair.py --root outputs/repair_artifacts --out docs/experiments/independent_repairs
      - uses: actions/upload-artifact@v4
        with:
          name: independently-confirmed-extended-repair-summary
          path: docs/experiments/independent_repairs/
          if-no-files-found: error
      - name: Save permanent nonbinary data and findings in Git repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/independent_repairs
          git diff --cached --quiet || git commit -m 'Archive two-seed Extended repair contrasts'
          git pull --rebase origin assignment-roadmap-g100-20261015
          git push origin HEAD:assignment-roadmap-g100-20261015
