name: Additional Extended G0-G10 independent seeds (4 and 5)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extended-g10-additional-two-seeds.yml'

permissions:
  contents: read
  actions: read

jobs:
  train-independent-g0:
    strategy:
      fail-fast: false
      matrix:
        seed: [7054, 8054]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Original source and Omniglot
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Original compatible JAX environment
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Original Base source configuration
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Train independent Extended G0 (identical hyperparameters, new seed)
        run: |
          python scripts/extended_g0.py --steps 9375 --batch-size 32 --eval-every 9375 --eval-count 512 --seed ${{ matrix.seed }} --learning-rate 0.0003 --temperature 1.0 --out outputs/extended_replica_g0
      - name: Verify complete unbiased G0 training (regardless of validation score)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/extended_replica_g0')
          m=json.loads((p/'metrics.json').read_text())
          assert m['seed']==${{ matrix.seed }} and m['class_split']==[50,1473,100]
          assert m['steps']*m['batch_size']==300000
          assert m['final_test_evaluated'] is False
          assert (p/'extended_g0_model.eqx').stat().st_size>1000
          print('INDEPENDENT_EXTENDED_G0='+json.dumps(m['history'][-1]['validation']))
          PY
      - name: Archive all independently trained baselines, including weaker seeds
        uses: actions/upload-artifact@v4
        with:
          name: extended-five-seed-g0-${{ matrix.seed }}
          path: outputs/extended_replica_g0/
          if-no-files-found: error

  replicate-two-main-conditions:
    needs: train-independent-g0
    strategy:
      fail-fast: false
      matrix:
        seed: [7054, 8054]
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Original feature task and new replication scripts
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pinned original model stack
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Base source configuration
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Independent G0 from THIS same workflow (not selected by validation score)
        uses: actions/download-artifact@v4
        with:
          name: extended-five-seed-g0-${{ matrix.seed }}
          path: outputs/extended_replica_g0/
      - name: Train independent Extended G1-G10 with same 300k exposure per generation
        run: |
          python scripts/extended_recursive.py --include-all-replication-seeds --generations 10 --steps 9375 --batch-size 32 --eval-every 9375 --eval-count 512 --seed ${{ matrix.seed }} --initialization-seed ${{ matrix.seed }} --learning-rate 0.0003 --temperature 1.0 --arms ${{ matrix.arm }} --extended-g0-artifact outputs/extended_replica_g0 --out outputs/extended_seed_replication
      - name: Verify ten model generations and held-out-only metrics
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          root=Path('outputs/extended_seed_replication')
          arm='${{ matrix.arm }}'
          s=json.loads((root/'summary.json').read_text())
          assert s['final_test_evaluated'] is False
          assert s['all_seed_replication_included_irrespective_of_g0_accuracy'] is True
          assert len(s['arms'][arm])==10
          for gen in range(1,11):
              folder=root/arm/f'g{gen:02d}'
              m=json.loads((folder/'metrics.json').read_text())
              assert m['final_test_evaluated'] is False
              assert m['training_exposures']==300000
              assert m['init_seed']==${{ matrix.seed }}
              assert m['data_seed']==${{ matrix.seed }}
              assert m['generation']==gen and m['condition']==arm
              assert (folder/'model.eqx').stat().st_size>1000
              assert math.isfinite(m['history'][-1]['validation']['val_relabel']['first_label_loss'])
          print('EXTENDED_REPLICATION_G10='+json.dumps({
              'seed':${{ matrix.seed }},'arm':arm,
              'g10':s['arms'][arm][-1]['last_validation']['val_relabel']
          }))
          PY
      - name: Preserve each independent full G1-G10 checkpoint/curve package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-five-seed-g10-${{ matrix.seed }}-${{ matrix.arm }}
          path: outputs/extended_seed_replication/
          if-no-files-found: warn
