name: Base induction-head interventions (validation only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-mechanistic-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout pinned original research implementation
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download completed Base checkpoint from this same repository
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install authors-compatible JAX dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Measure original model head matching and ablations
        run: python scripts/base_mechanistic.py --num-eval 256 --seed 3201
      - name: Preserve validation-only intervention results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-1m-mechanistic-validation
          path: outputs/base_mechanistic/
          if-no-files-found: warn
