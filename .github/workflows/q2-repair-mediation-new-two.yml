name: Complete two new repaired G10 seed mechanistic comparisons
on:
  push:
    branches: [nlp-q2-repair-mediation-20261016]
    paths: ['.github/workflows/q2-repair-mediation-new-two.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  repair-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 7054, init_seed: 7054, source_mode: train, original_run: 38788302762, original_artifact: extended-five-seed-g10-7054-recursive_replacement, g0_run: 38788302762, g0_artifact: extended-five-seed-g0-7054}
          - {seed: 8054, init_seed: 8054, source_mode: train, original_run: 38788302762, original_artifact: extended-five-seed-g10-8054-recursive_replacement, g0_run: 38788302762, g0_artifact: extended-five-seed-g0-8054}
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ github.token }}
          path: outputs/base_g0
      - name: Download matched pre-existing repair or original source G9
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.original_artifact }}
          run-id: ${{ matrix.original_run }}
          github-token: ${{ github.token }}
          path: ${{ matrix.source_mode == 'train' && 'outputs/source' || 'outputs/repair' }}
      - name: Download seed-specific original G0 for new correction
        if: matrix.source_mode == 'train'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.g0_artifact }}
          run-id: ${{ matrix.g0_run }}
          github-token: ${{ github.token }}
          path: outputs/extended_g0
      - run: python scripts/check_data.py
      - name: Train new seed G10 on matched corrected generated targets
        if: matrix.source_mode == 'train'
        run: |
          python scripts/extended_g10_repair.py \
            --include-all-replication-seeds --base-root outputs/base_g0 \
            --g0-root outputs/extended_g0 --g10-root outputs/source \
            --repair fix_invalid_q2 --seed ${{ matrix.seed }} \
            --init-seed ${{ matrix.init_seed }} --steps 9375 \
            --learning-rate 0.0003 --temperature 1.0 \
            --out outputs/repair
      - name: Validate actual training-target correction and load matched checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('outputs/repair/fix_invalid_q2/g10/metrics.json').read_text())
          assert meta['generation']==10
          assert meta['final_test_access'] is False
          assert meta['repair']=='fix_invalid_q2'
          assert meta['train_exposures']==300000
          assert meta['source_data_seed']==${{ matrix.seed }}
          assert meta['model_initialization_seed']==${{ matrix.init_seed }}
          assert meta['intervention_on_synthetic_training_targets_only'] is True
          assert Path('outputs/repair/fix_invalid_q2/g10/model.eqx').stat().st_size>1000
          assert meta['total_synthetic_target_quality']['source_off_context_symbols']>0
          assert meta['total_synthetic_target_quality']['corrected_off_context_symbols_remaining']==0
          print('MATCHED_REPAIRED_MODEL_VERIFIED='+json.dumps({
            'seed':meta['source_data_seed'],
            'corrupted_rows_repaired':meta['total_synthetic_target_quality']['source_off_context_symbols'],
            'validation_q2_validity':meta['history'][-1]['validation']['val_relabel']['free_next_symbol_context_validity']
          }),flush=True)
          PY
      - name: Measure repaired model q2 context-dependent head mediation
        run: |
          python scripts/q2_context_activation_patch_pilot.py \
            --arm fix_invalid_q2 --base-root outputs/base_g0 \
            --model-root outputs/repair/fix_invalid_q2/g10 \
            --out outputs/q2_mediation/${{ matrix.seed }}-fix_invalid_q2.json \
            --n 128
      - name: Retain repair checkpoint for newly trained seeds
        if: matrix.source_mode == 'train'
        uses: actions/upload-artifact@v4
        with:
          name: corrected-g10-extended-${{ matrix.seed }}
          path: outputs/repair/fix_invalid_q2/g10/
          if-no-files-found: error
      - name: Archive measured paired-scoped intervention
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-mediation-repaired-${{ matrix.seed }}
          path: outputs/q2_mediation/
          if-no-files-found: warn
  archive:
    needs: repair-and-patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nlp-q2-repair-mediation-20261016
      - uses: actions/download-artifact@v4
        with:
          pattern: q2-mediation-repaired-*
          path: docs/experiments/q2_repair_mediation/extra_two
          merge-multiple: false
      - name: Aggregate five exact matched model-seed comparisons
        run: |
          python scripts/aggregate_q2_repair_mediation.py \
            --raw-root docs/experiments/q2_activation_patching/five_seeds \
            --repaired-root docs/experiments/q2_repair_mediation \
            --out docs/experiments/q2_repair_mediation
      - name: Persist five-seed repaired versus unrepaired mediator effects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/q2_repair_mediation
          git diff --cached --quiet || git commit -m "Verify restored symbol validity and attention effects in five G10 model pairs"
          git push origin HEAD:nlp-q2-repair-mediation-20261016
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-five-seed-q2-causal-summary
          path: docs/experiments/q2_repair_mediation/
          if-no-files-found: error
