name: Evaluate Base and Extended on validation without opening test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/evaluator-validation-smoke.yml'
      - 'scripts/evaluate_sealed.py'
      - 'scripts/evaluate_contract_smoke.py'

permissions:
  contents: read
  actions: read

jobs:
  validate-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout original data/model code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Authors-compatible dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Download verified Base G0 and configuration
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Download validation-selected Extended G0
        uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0_selected/
      - name: Run same frozen evaluator on 128 validation examples only
        run: python scripts/evaluate_contract_smoke.py
