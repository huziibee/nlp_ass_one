name: Original Singh Base model CPU smoke (safe validation only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-base-smoke.yml'
      - 'scripts/paper_base_smoke.py'
      - 'requirements-model-smoke.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout original source and data
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python compatible with original 2024 JAX repository
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned legacy model dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Preview protected split and training parameters
        run: python scripts/paper_base_smoke.py --steps 4 --batch-size 8 --dry-run
      - name: Run four real Base optimizer updates (32 sequences; NOT paper reproduction)
        run: python scripts/paper_base_smoke.py --steps 4 --batch-size 8
      - name: Archive optional smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-base-smoke-environment
          path: outputs/paper_smoke/
          if-no-files-found: ignore
