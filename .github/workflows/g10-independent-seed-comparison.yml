name: Aggregate three-seed Base and Extended G10 controls

# Manual until the in-flight original Base and Extended independent-seed
# workflows have finished and published their original checkpoints.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-three-seed-g10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get exact G10 aggregation implementation
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Original Base G10 conditions
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-g10-*
          run-id: 38632979396
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/base_primary
          merge-multiple: false
      - name: New independent Base G10 conditions
        uses: actions/download-artifact@v4
        with:
          pattern: original-base-independent-g10-*
          run-id: 38642335173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/base_replica
          merge-multiple: false
      - name: Original Extended G10 conditions
        uses: actions/download-artifact@v4
        with:
          pattern: extended-original-g10-*
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/extended_primary
          merge-multiple: false
      - name: New independent Extended G10 conditions
        uses: actions/download-artifact@v4
        with:
          pattern: extended-independent-g10-*
          run-id: 38641472801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/seed_artifacts/extended_replica
          merge-multiple: false
      - name: Verify 12 trained arms across six model seeds and infer paired effects
        run: |
          python scripts/aggregate_independent_seeds_g10.py --root outputs/seed_artifacts --out outputs/seed_comparison
      - name: Archive independently confirmed G10 differences and uncertainty
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-three-seed-base-extended-g10
          path: outputs/seed_comparison/
          if-no-files-found: error
