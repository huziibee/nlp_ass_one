name: Final project preflight — dependencies, tests, source data, research provenance
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-final-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  clean-room-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install actual submission requirements
        run: python -m pip install -r requirements.txt
      - name: Verify original HDF5 checksum shape and held-out source split
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/check_reference_split.json
      - name: Run all repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify original and followup model metrics and no new test leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('docs/experiments')
          a=json.loads((d/'g10_three_seed'/'g10_seed_summary.json').read_text())
          assert a['n_model_seeds_per_task']==3
          assert a['evaluation'].startswith('validation-only')
          b=json.loads((d/'graded_repair'/'summary.json').read_text())
          assert b['protected_final_test_accessed'] is False
          assert len(b['results'])==5
          assert b['results'][0]['repair_pct']==0 and b['results'][-1]['repair_pct']==100
          assert [r['validity'] for r in b['results']]==sorted(r['validity'] for r in b['results'])
          c=json.loads((d/'factorial_invalid_repair'/'summary.json').read_text())
          assert c['final_test_evaluated'] is False and len(c['results'])==4
          h=json.loads((d/'extended_joint_heads'/'extended-joint-heads-clean_only'/'clean_only.json').read_text())
          assert h['final_test_evaluated'] is False and len(h['top_heads'])==8
          f=json.loads((d/'base_full_budget_300k'/'summary.json').read_text())
          assert f['g0_exposures']==f['descendant_exposures']==300000
          assert len(f['arms']['clean_only'])==len(f['arms']['recursive_replacement'])==10
          assert f['protected_final_test'] is False
          m=json.loads((d/'cumulative_corpus'/'summary.json').read_text())
          assert m['final_test_evaluated'] is False
          assert m['actual_pool_increases_per_generation'] is True
          print('FINAL_PREFLIGHT_ARCHIVED_SOURCE_METRICS_VERIFIED')
          PY
      - name: Show exact commit and remaining manual requirements
        run: |
          git rev-parse HEAD
          echo 'Research tested on GitHub Actions. A successful run does not replace lecturer ethics questionnaire, authors contributions, LaTeX external report or actual Moodle submission.'
