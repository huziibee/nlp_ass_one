name: Pilot same-model q2 activation patching
on:
  push:
    branches: [nlp-q2-causal-patching-pilot-20261016]
    paths: ['.github/workflows/q2-activation-patching-pilot.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, recursive_replacement]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ github.token }}
          path: outputs/base_g0
      - uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-${{ matrix.arm }}
          run-id: 38633208767
          github-token: ${{ github.token }}
          path: outputs/extended_g10
      - name: Verify Omniglot class partition
        run: python scripts/check_data.py
      - name: Measure head mediation on changing contextual distractor
        run: |
          python scripts/q2_context_activation_patch_pilot.py \
            --arm ${{ matrix.arm }} \
            --base-root outputs/base_g0 \
            --model-root outputs/extended_g10/${{ matrix.arm }}/g10 \
            --out outputs/patch/${{ matrix.arm }}.json --n 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-patch-pilot-${{ matrix.arm }}
          path: outputs/patch/
          if-no-files-found: warn
  archive:
    needs: pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nlp-q2-causal-patching-pilot-20261016
      - uses: actions/download-artifact@v4
        with:
          pattern: q2-patch-pilot-*
          path: docs/experiments/q2_activation_patching
          merge-multiple: false
      - name: Validate placebo and intervention outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/experiments/q2_activation_patching')
          fs=list(root.rglob('*.json'))
          assert len(fs)==2,fs
          for f in fs:
              data=json.loads(f.read_text())
              assert data['final_test_accessed'] is False
              assert data['n']==128
              for a in data['layers'].values():
                  assert a['identity_patch_max_error']<3e-5,a
                  assert a['future_token_patch_max_error']<3e-5,a
                  assert len(a['head_level'])==8
          print('PATCH_VALIDATED',*[f.name for f in fs])
          PY
      - name: Commit validated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiments/q2_activation_patching
          git diff --cached --quiet || git commit -m "Archive empirical q2 within-model patching pilot"
          git push origin HEAD:nlp-q2-causal-patching-pilot-20261016
# Retry after correcting mapped-donor input to intervention function.
