name: Fresh five-seed G0-G10 complete retraining
# Train EVERY model from new weights. Historical checkpoints are forbidden.
# The real frozen original-feature Omniglot dataset is deliberately reused.
# This workflow intentionally does not run on merge to main.
on:
  workflow_dispatch:
  push:
    branches: [fresh-five-seed-retraining-20261025]
    paths:
      - '.github/workflows/fresh-five-seed-full.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: fresh-five-seed-training-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Lock protocol, verify original data, compile and run 56+ tests
        run: |
          python -m pip install -r requirements.txt
          python scripts/check_data.py
          python -m compileall -q scripts src tests run.py
          python -m unittest discover -s tests -v
          python scripts/fresh_five_seed.py plan > fresh_five_plan.json
          grep -F '"historical_checkpoints_used_as_initialization": false' fresh_five_plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-immutable-protocol
          path: fresh_five_plan.json
          if-no-files-found: error
          retention-days: 90

  fresh-base-g0:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {i: 0, init: 1005}
          - {i: 1, init: 1105}
          - {i: 2, init: 1205}
          - {i: 3, init: 1305}
          - {i: 4, init: 1405}
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - name: Verify real original-feature data
        run: python scripts/check_data.py
      - name: Train a genuinely NEW Base G0 at 1,000,000 examples
        run: |
          python scripts/base_replica_g0.py --init-seed ${{ matrix.init }} --out outputs/fresh_base_g0
      - name: Confirm fresh initialisation, G0 checkpoint, data scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/fresh_base_g0')
          m=json.loads((p/'independent_protocol.json').read_text())
          c=json.loads((p/'safe_train_val_smoke/config.json').read_text())
          assert m['independent_seed']==${{ matrix.init }}
          assert m['training_sequences']==c['train_iters']==1_000_000
          assert m['final_test_evaluated'] is False
          assert c['class_split']==[50,1473,100]
          assert (p/'safe_train_val_smoke/checkpoints/00001000000.eqx').stat().st_size>1000
          print('FRESH_BASE_G0_COMPLETE',m['independent_seed'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-base-g0-${{ matrix.i }}
          path: outputs/fresh_base_g0/
          if-no-files-found: error
          retention-days: 90

  fresh-extended-g0:
    needs: fresh-base-g0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {i: 0, seed: 9054}
          - {i: 1, seed: 10054}
          - {i: 2, seed: 11054}
          - {i: 3, seed: 12054}
          - {i: 4, seed: 13054}
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - name: Fresh Base CONFIG only, never use historical trained Base weights
        uses: actions/download-artifact@v4
        with:
          name: fresh-v1-base-g0-${{ matrix.i }}
          path: outputs/fresh_base_g0/
      - name: Train a genuinely NEW Extended G0 at 300,000 examples
        run: |
          python scripts/extended_g0.py --artifact-root outputs/fresh_base_g0 \
            --seed ${{ matrix.seed }} --steps 9375 --batch-size 32 \
            --eval-every 9375 --eval-count 512 --learning-rate 0.0003 \
            --temperature 1.0 --out outputs/fresh_extended_g0
      - name: Verify independent Extended G0 and no test access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/fresh_extended_g0')
          m=json.loads((p/'metrics.json').read_text())
          assert m['seed']==${{ matrix.seed }}
          assert m['steps']*m['batch_size']==300000
          assert m['class_split']==[50,1473,100]
          assert m['final_test_evaluated'] is False
          assert (p/'extended_g0_model.eqx').stat().st_size>1000
          print('FRESH_EXTENDED_G0_COMPLETE',m['seed'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-extended-g0-${{ matrix.i }}
          path: outputs/fresh_extended_g0/
          if-no-files-found: error
          retention-days: 90

  fresh-base-arms:
    needs: fresh-base-g0
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {i: 0, seed: 39001, arm: clean_only}
          - {i: 0, seed: 39001, arm: recursive_replacement}
          - {i: 1, seed: 40001, arm: clean_only}
          - {i: 1, seed: 40001, arm: recursive_replacement}
          - {i: 2, seed: 41001, arm: clean_only}
          - {i: 2, seed: 41001, arm: recursive_replacement}
          - {i: 3, seed: 42001, arm: clean_only}
          - {i: 3, seed: 42001, arm: recursive_replacement}
          - {i: 4, seed: 43001, arm: clean_only}
          - {i: 4, seed: 43001, arm: recursive_replacement}
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - name: Load fresh Base G0 FROM THIS WORKFLOW RUN only
        uses: actions/download-artifact@v4
        with:
          name: fresh-v1-base-g0-${{ matrix.i }}
          path: outputs/fresh_base_g0/
      - name: Retrain ten new Base generations, 1M examples each
        run: |
          python scripts/base_recursive.py --artifact-root outputs/fresh_base_g0 \
            --generations 10 --steps 31250 --batch-size 32 \
            --eval-every 31250 --eval-count 512 --seed ${{ matrix.seed }} \
            --temperature 1.0 --arms ${{ matrix.arm }} --out outputs/fresh_base_arm
      - name: Validate ALL saved G1-G10 trained checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm='${{ matrix.arm }}'
          root=Path('outputs/fresh_base_arm')
          s=json.loads((root/'summary.json').read_text())
          assert s['final_test_evaluated'] is False and set(s['arms'])=={arm}
          assert [v['generation'] for v in s['arms'][arm]]==list(range(1,11))
          for g in range(1,11):
            p=root/arm/f'g{g:02d}'
            m=json.loads((p/'metrics.json').read_text())
            assert m['data_seed']==${{ matrix.seed }}
            assert m['optimizer_exposures']==1000000 and m['final_test_evaluated'] is False
            assert (p/'model.eqx').stat().st_size>1000
          print('FRESH_BASE_G1_G10_COMPLETE',arm,${{ matrix.seed }})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-base-arm-${{ matrix.i }}-${{ matrix.arm }}
          path: outputs/fresh_base_arm/
          if-no-files-found: error
          retention-days: 90

  fresh-extended-arms:
    needs: fresh-extended-g0
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {i: 0, seed: 9054, arm: clean_only}
          - {i: 0, seed: 9054, arm: recursive_replacement}
          - {i: 1, seed: 10054, arm: clean_only}
          - {i: 1, seed: 10054, arm: recursive_replacement}
          - {i: 2, seed: 11054, arm: clean_only}
          - {i: 2, seed: 11054, arm: recursive_replacement}
          - {i: 3, seed: 12054, arm: clean_only}
          - {i: 3, seed: 12054, arm: recursive_replacement}
          - {i: 4, seed: 13054, arm: clean_only}
          - {i: 4, seed: 13054, arm: recursive_replacement}
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-model-smoke.txt
      - name: Fresh Base G0 config from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: fresh-v1-base-g0-${{ matrix.i }}
          path: outputs/fresh_base_g0/
      - name: Fresh Extended G0 weights from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: fresh-v1-extended-g0-${{ matrix.i }}
          path: outputs/fresh_extended_g0/
      - name: Train 10 NEW Extended descendants without excluding weak seeds
        run: |
          python scripts/extended_recursive.py --base-artifact outputs/fresh_base_g0 \
            --extended-g0-artifact outputs/fresh_extended_g0 \
            --generations 10 --steps 9375 --batch-size 32 \
            --eval-every 9375 --eval-count 512 --seed ${{ matrix.seed }} \
            --initialization-seed ${{ matrix.seed }} \
            --learning-rate 0.0003 --temperature 1.0 \
            --include-all-replication-seeds --arms ${{ matrix.arm }} \
            --out outputs/fresh_extended_arm
      - name: Validate ALL saved Extended G1-G10 trained checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm='${{ matrix.arm }}'
          root=Path('outputs/fresh_extended_arm')
          s=json.loads((root/'summary.json').read_text())
          assert s['final_test_evaluated'] is False and set(s['arms'])=={arm}
          assert s['all_seed_replication_included_irrespective_of_g0_accuracy'] is True
          assert [v['generation'] for v in s['arms'][arm]]==list(range(1,11))
          for g in range(1,11):
            p=root/arm/f'g{g:02d}'
            m=json.loads((p/'metrics.json').read_text())
            assert m['data_seed']==${{ matrix.seed }}
            assert m['init_seed']==${{ matrix.seed }}
            assert m['training_exposures']==300000 and m['final_test_evaluated'] is False
            assert (p/'model.eqx').stat().st_size>1000
          print('FRESH_EXTENDED_G1_G10_COMPLETE',arm,${{ matrix.seed }})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-extended-arm-${{ matrix.i }}-${{ matrix.arm }}
          path: outputs/fresh_extended_arm/
          if-no-files-found: error
          retention-days: 90

  verify-all-fresh-results:
    needs: [fresh-base-arms, fresh-extended-arms]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Retrieve all five fresh Base G0 checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-v1-base-g0-*
          path: outputs/fresh_five_inputs/base_g0
          merge-multiple: false
      - name: Retrieve all five fresh Extended G0 checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-v1-extended-g0-*
          path: outputs/fresh_five_inputs/extended_g0
          merge-multiple: false
      - name: Retrieve all ten fresh Base arm training chains
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-v1-base-arm-*
          path: outputs/fresh_five_inputs/base_arms
          merge-multiple: false
      - name: Retrieve all ten fresh Extended arm training chains
        uses: actions/download-artifact@v4
        with:
          pattern: fresh-v1-extended-arm-*
          path: outputs/fresh_five_inputs/extended_arms
          merge-multiple: false
      - name: Verify exactly 10 G0, 200 descendant checkpoints and final-test isolation
        run: |
          python scripts/fresh_five_seed.py aggregate \
            --root outputs/fresh_five_inputs --out outputs/fresh_five_results
      - name: Preserve NEW experiment results (never overwrite original G10 evidence)
        uses: actions/upload-artifact@v4
        with:
          name: fresh-v1-independent-five-seed-results
          path: outputs/fresh_five_results/
          if-no-files-found: error
          retention-days: 90
