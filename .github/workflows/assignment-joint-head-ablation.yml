name: Original Extended causal joint-head ablation across generations
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-joint-head-ablation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mechanistic-joint-heads:
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-omniglot-lr3e4-300k
          run-id: 38630071147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g0/
      - uses: actions/download-artifact@v4
        with:
          name: extended-original-3gen-fixedinit-${{ matrix.arm }}
          run-id: 38631919983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g3/
      - uses: actions/download-artifact@v4
        with:
          name: extended-original-g10-${{ matrix.arm }}
          run-id: 38633208767
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/extended_g10/
      - name: Verify source features
        run: python scripts/check_data.py
      - name: Compare training-preselected single, dual and triple L2 head knockouts
        run: |
          python scripts/extended_joint_head_ablations.py --base-root outputs/base_g0 --g0-root outputs/extended_g0 --g3-root outputs/extended_g3 --g10-root outputs/extended_g10 --arm ${{ matrix.arm }} --n 128 --out outputs/joint/${{ matrix.arm }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-joint-heads-${{ matrix.arm }}
          path: outputs/joint/
          if-no-files-found: warn
  archive:
    needs: mechanistic-joint-heads
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: extended-joint-heads-*
          path: docs/experiments/extended_joint_heads/
          merge-multiple: false
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('docs/experiments/extended_joint_heads').rglob('*.json'))
          assert len(files)==2
          for f in files:
              d=json.loads(f.read_text())
              assert d['final_test_evaluated'] is False
              assert set(d['validation']['val_relabel'])=={'0','3','6','10'}
          print('JOINT_HEAD_REPLICATION_ARCHIVE_OK')
          PY
      - name: Commit actual measured head interventions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/extended_joint_heads
          git diff --cached --quiet || git commit -m 'Preserve measured paired clean-recursive multi-head interventions'
          git pull --rebase origin assignment-mechanism-followups-20261015
          git push origin HEAD:assignment-mechanism-followups-20261015
