name: Base 1M-sequence induction-head reproduction (validation only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-full-reproduction.yml'

permissions:
  contents: read

jobs:
  reproduce-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout pinned authors source and original HDF5
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned JAX and original-model libraries
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Validate original source and class split before training
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/base_split_manifest.json
      - name: Train original Base for one million sequences, evaluate on validation only
        run: python scripts/paper_base_full.py
      - name: Preserve trained checkpoints, metrics and exact run protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-paper-1m-validation-only
          path: outputs/base_full_1m/
          if-no-files-found: warn
