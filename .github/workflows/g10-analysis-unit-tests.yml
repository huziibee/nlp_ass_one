name: Verify G10 statistical aggregation and test isolation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/aggregate_independent_seeds_g10.py'
      - 'tests/test_aggregate_independent_seeds_g10.py'
      - '.github/workflows/g10-analysis-unit-tests.yml'

permissions:
  contents: read

jobs:
  check-aggregation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test seeded pairing, complete model count and no final-test access
        run: python -m unittest -v tests.test_aggregate_independent_seeds_g10
