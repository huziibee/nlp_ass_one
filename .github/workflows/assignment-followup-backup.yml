name: Persist mechanistic followup models and result artifacts in GitHub release
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-followup-backup.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nlp-15oct-followup-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for actual result jobs, archive successes and record failures
        run: bash scripts/archive_followup_release.sh
