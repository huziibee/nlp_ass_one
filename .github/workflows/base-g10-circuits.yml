name: Compare actual original-Base induction circuits from G0 to G10

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-g10-circuits.yml'

permissions:
  contents: read
  actions: read

jobs:
  mechanism-by-arm:
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, frozen_g0, real_anchor_half, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Pinned original source and Omniglot feature data
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install original optogenetic and JAX dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Original trained Base G0
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Original G3 Base checkpoint
        uses: actions/download-artifact@v4
        with:
          name: original-base-3gen-${{ matrix.arm }}
          run-id: 38627953800
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_original_g3/
      - name: Verified G6 and G10 Base checkpoints
        uses: actions/download-artifact@v4
        with:
          name: original-base-g10-${{ matrix.arm }}
          run-id: 38632979396
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_g10/
      - name: Verify original dataset
        run: python scripts/check_data.py
      - name: Compare prespecified original induction head and G0 G3 G6 G10 circuits
        run: |
          python scripts/compare_base_circuits_g10.py --g3-root outputs/base_original_g3 --g10-root outputs/base_g10 --arm ${{ matrix.arm }} --n 128 --seed 3201 --out outputs/g10_circuits/${{ matrix.arm }}.json
      - name: Assert complete intervention results and no final-test access
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          data=json.loads(Path('outputs/g10_circuits/${{ matrix.arm }}.json').read_text())
          assert data['test_evaluated'] is False
          assert data['model_seed_replicates']==1
          assert data['chosen_induction_head_index']==3
          assert data['generations']==[0,3,6,10]
          assert set(data['results'])=={'0','3','6','10'}
          for vals in data['results'].values():
              assert set(vals)=={'val_relabel','val_classes'}
              for v in vals.values():
                  assert v['n']==128
                  for metric in ('natural_accuracy','fixed_head3_knockout_accuracy',
                     'fixed_head3_retain_only_accuracy','fixed_head3_oracle_match_accuracy',
                     'fixed_previous_head_knockout_accuracy'):
                      assert math.isfinite(v[metric]) and 0<=v[metric]<=1
          print('BASE_G10_CAUSAL_INTERVENTIONS_VALIDATED')
          PY
      - name: Preserve original source circuit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-induction-circuit-g10-${{ matrix.arm }}
          path: outputs/g10_circuits/
          if-no-files-found: warn
