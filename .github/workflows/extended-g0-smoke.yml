name: Smoke test original Omniglot Extended three-token model

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/extended_omniglot.py'
      - 'src/extended_learner.py'
      - 'scripts/extended_g0.py'
      - '.github/workflows/extended-g0-smoke.yml'

permissions:
  contents: read
  actions: read

jobs:
  extended-g0-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout pinned original authors code and Omniglot
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install original model dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Download author-aligned original Base config
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Original feature/split validation
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/protocol.json
      - name: Exercise three-token teacher-forced training and autoregressive evaluation
        run: |
          python scripts/extended_g0.py --steps 8 --batch-size 8 --eval-every 8 --eval-count 64 --seed 4054 --learning-rate 0.00001 --out outputs/extended_g0_smoke
      - name: Verify causal output order and original Base-5-token consistency
        run: python scripts/verify_extended_causality.py --trained outputs/extended_g0_smoke
      - name: Validate artifacts and heldout-only metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/extended_g0_smoke')
          d=json.loads((p/'metrics.json').read_text())
          assert (p/'extended_g0_model.eqx').stat().st_size>1000
          assert d['final_test_evaluated'] is False
          assert d['class_split']==[50,1473,100]
          assert d['steps']==8
          assert len(d['history'])>=2
          m=d['history'][-1]['validation']
          assert set(m)=={'val_relabel','val_exemplar','val_classes'}
          for v in m.values():
              assert 0<=v['first_label_accuracy']<=1
              assert 0<=v['teacher_forced_second_label_accuracy']<=1
              assert v['final_test_evaluated'] is False
          assert m['val_classes']['next_symbol_global_class_id_evaluation'].startswith('NOT_DEFINED')
          assert 'free_next_symbol_context_validity' in m['val_relabel']
          print('EXTENDED_G0_SMOKE_PASSED')
          PY
      - name: Upload checked model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-original-omniglot-g0-smoke
          path: outputs/extended_g0_smoke/
          if-no-files-found: warn
