name: Full original-Base recursion (3 generations, 1M episodes each)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/base-recursion-full.yml'

permissions:
  contents: read
  actions: read

jobs:
  train-recursive-base:
    strategy:
      fail-fast: false
      matrix:
        arm:
          - clean_only
          - recursive_replacement
          - real_anchor_half
          - frozen_g0
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - name: Checkout project with original paper and feature file
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install compatible original model dependencies
        run: python -m pip install -r requirements-model-smoke.txt
      - name: Download verified original G0 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_full_1m/
      - name: Verify the canonical data and class/label partitions
        run: |
          python scripts/check_data.py
          python scripts/reference_split.py --out /tmp/verified_split.json
      - name: Train one matched Base arm for three full generations
        run: |
          python scripts/base_recursive.py --generations 3 --steps 31250 --batch-size 32 --eval-every 3125 --eval-count 512 --seed 34001 --temperature 1.0 --arms ${{ matrix.arm }} --out outputs/base_recursive_full
      - name: Export train/validation curves
        run: |
          python scripts/summarize_base_recursive.py --root outputs/base_recursive_full --generations 3 --arms ${{ matrix.arm }} --out outputs/base_recursive_full/curves_${{ matrix.arm }}.csv
      - name: Archive model checkpoints and measured metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-base-3gen-${{ matrix.arm }}
          path: outputs/base_recursive_full/
          if-no-files-found: warn
