name: Match Base versus Extended descendant training exposures (300k)
on:
  push:
    branches: [assignment-mechanism-followups-20261015]
    paths: ['.github/workflows/assignment-base-matched-budget.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  matched-base:
    strategy:
      fail-fast: false
      matrix:
        arm: [clean_only, recursive_replacement]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-model-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          name: base-paper-1m-validation-only
          run-id: 38612082174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/base_g0/
      - name: Train Base G1-G10 with exactly 300k exposures per generation
        run: |
          python scripts/check_data.py
          python scripts/base_recursive.py --artifact-root outputs/base_g0 --out outputs/matched_base/ --generations 10 --steps 9375 --batch-size 32 --eval-every 9375 --eval-count 512 --seed 34001 --temperature 1 --arms ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-descendant300k-${{ matrix.arm }}
          path: outputs/matched_base/
          if-no-files-found: warn
  aggregate:
    needs: matched-base
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: base-descendant300k-*
          path: inputs/
          merge-multiple: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Verify no final test, full 300k descendants; preserve seed-level validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path('docs/experiments/base_budget_matched');o.mkdir(parents=True,exist_ok=True)
          r={"note":"Descendant budget equals Extended 300k; Base G0 remains original 1M, unlike Extended G0, and models differ architecturally","n_seeds":1,"arms":{},"final_test_evaluated":False}
          for arm in ('clean_only','recursive_replacement'):
              folder=Path('inputs')/('base-descendant300k-'+arm)
              s=json.loads((folder/'summary.json').read_text())
              assert s['final_test_evaluated'] is False
              assert len(s['arms'][arm])==10
              rows=[]
              for g in range(1,11):
                  m=json.loads((folder/arm/f'g{g:02d}'/'metrics.json').read_text())
                  assert m['optimizer_exposures']==300000 and m['final_test_evaluated'] is False
                  rows.append({'generation':g,'val_relabel':m['history'][-1]['validation']['val_relabel']['accuracy'],
                    'val_classes':m['history'][-1]['validation']['val_classes']['accuracy']})
              r['arms'][arm]=rows
          (o/'summary.json').write_text(json.dumps(r,indent=2))
          print('BASE_DESCENDANT_BUDGET_MATCHED='+json.dumps({k:v[-1] for k,v in r['arms'].items()}))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/base_budget_matched/
          git diff --cached --quiet || git commit -m 'Archive 300k-example Base descendant matched-budget comparison'
          git pull --rebase origin assignment-mechanism-followups-20261015
          git push origin HEAD:assignment-mechanism-followups-20261015
